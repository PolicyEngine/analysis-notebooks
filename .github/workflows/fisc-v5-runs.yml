# Scratch branch only: the last FISC reruns for PR 139, off the shared Mac while the
# Microcosm US release holds heavy local work. Delete this branch after the download.
name: FISC v5 runs
on:
  push:
    branches: [fisc-v5-runs]
permissions:
  contents: read
jobs:
  ticket:
    name: ${{ matrix.set }} ${{ matrix.ticket }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { set: child_credit, ticket: fisc, os: ubuntu-24.04 }
          - { set: child_credit, ticket: "2028", os: ubuntu-24.04 }
          - { set: child_credit, ticket: fisc, os: ubuntu-24.04-arm }
          - { set: child_credit, ticket: "2028", os: ubuntu-24.04-arm }
    defaults:
      run:
        working-directory: us/congress/fisc_marriage_bonus
    env:
      OMP_NUM_THREADS: "4"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the pinned bundle
        run: |
          uv venv --python 3.13.9 .venv
          uv pip install --python .venv/bin/python -r requirements-v5.txt
      - name: Run the ticket
        run: |
          mkdir -p out
          FACTORS="factors-v5/factors_${{ matrix.set }}.npz"
          case "${{ matrix.ticket }}" in
            20*) cmd=(decade.py "${{ matrix.ticket }}" --out out --weight-factors "$FACTORS") ;;
            *) cmd=(run.py "${{ matrix.ticket }}" 2026 --out out --people --detail --weight-factors "$FACTORS") ;;
          esac
          {
            git rev-parse HEAD
            uname -a
            .venv/bin/python --version
            sha256sum "$FACTORS" run.py decade.py analysis.py reweight.py
          } > out/platform.txt
          .venv/bin/python - "${cmd[@]}" <<'PY'
          import resource, subprocess, sys

          rc = subprocess.call([sys.executable, *sys.argv[1:]])
          peak = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss / 1e6
          print(f"peak_rss_gb {peak:.2f}", flush=True)
          with open("out/peak_rss.txt", "w") as file:
              file.write(f"{peak:.2f}\n")
          sys.exit(rc)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.set }}-${{ matrix.ticket }}-${{ matrix.os }}
          path: us/congress/fisc_marriage_bonus/out/
          retention-days: 14
